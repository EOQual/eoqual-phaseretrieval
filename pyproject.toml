# Documentation de poetry: https://python-poetry.org/docs/pyproject/

[tool.poetry]
name = "eoqual-phaseretrieval"
version = "0.1.0"
description = "PSF -> WFE -> Zernike coefficients, by phase retrieval and phase diversity"
authors = ["Olivier Amram <olivier.amram@free.fr>"]
maintainers = [
    "Olivier Amram <olivier.amram@free.fr>"
]
repository = "https://github.com/EOQual/eoqual-phaseretrieval.git"
readme = "README.md"
license = "MIT"
keywords = ["phase-retrieval", "phase-diversity", "zernike", "wavefront", "psf", "remote-sensing", "earth-observation"]
packages = [{include = "eoqual/phaseretrieval", from = "src"}]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = "*"
scipy = "*"
scikit-image = "*"
# poppy : base de Zernike (ordre de Noll) — voir optics.build_zernike_basis.
# BSD-3-Clause, STScI.
poppy = "*"
plotly = "*"
loguru = "*"
commentjson = "*"
imageio = "*"
rich = "*"

[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autoapi = "*"

[tool.poetry.group.dev.dependencies]
poetry = "^2.1.1"
ipython = "^8.8.0"
black = "^23.3.0"
coverage = "^6.5.0"
pylint = "*"
pytest = "<9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
